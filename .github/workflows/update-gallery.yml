name: Update Cake Catalogs
'on':
  push:
    branches: [main]
    paths:
      - 'gallery/**'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update decoration and gallery lists
        shell: python
        run: |
          import json
          from pathlib import Path
          cats = ['Bonbons','Butterflies','Fruits','Ribbons','Glitters','Pearls']
          gcats = {'wedding':'wedding','birthday':'birthday','corporate':'corporate','occasion':'occasion'}
          imgext = {'.png','.jpg','.jpeg','.webp','.gif'}
          decor = {}
          for c in cats:
              folder = Path('gallery/overlays') / c
              decor[c] = [f.as_posix() for f in sorted(folder.iterdir()) if f.is_file() and f.suffix.lower() in imgext] if folder.is_dir() else []
          gals = {}
          for key, foldername in gcats.items():
              folder = Path('gallery/cakes') / foldername
              gals[key] = [f.as_posix() for f in sorted(folder.iterdir()) if f.is_file() and f.suffix.lower() in imgext | {'.mp4','.webm'}] if folder.is_dir() else []
          Path('decorations-data.js').write_text('const decorationCatalog = ' + json.dumps(decor,indent=2) + ';\n',encoding='utf-8')
          Path('gallery-data.js').write_text('const galleries = ' + json.dumps(gals,indent=2) + ';\n',encoding='utf-8')
      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decorations-data.js gallery-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update cake catalogs"
            git push
          fi
